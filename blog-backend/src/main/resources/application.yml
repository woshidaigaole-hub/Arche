# 服务器端口
server:
  port: 8080

# MySQL 数据源 —— 把 blog_db 改成你本地实际数据库名
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 13960020950

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 数据库下划线字段 → Java驼峰，如 create_time → createTime
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印SQL，学习期开着
  global-config:
    db-config:
      id-type: auto  # 主键自增

# JWT 密钥 & 过期时间
jwt:
  secret: blog-secret-key-must-be-at-least-32-bytes-long!!  # 签名密钥（生产环境用复杂随机串）
  expiration: 86400000  # token有效期 24小时（毫秒）
